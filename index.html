<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f1e9">
  <title>卓上ミニハウス | Tabletop AR</title>
  <link rel="stylesheet" href="style.css">
  <!-- 授業資料の構成：A-Frame → AR.js → script.js -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>
  <script src="script.js" defer></script>
</head>
<body>
  <header class="brand"><span class="eyebrow">SPATIAL COMPUTING / 06</span><h1>机の上の、小さな暮らし。</h1><p>TABLETOP MINI HOUSE</p></header>
  <main id="welcome" class="welcome">
    <span class="tag">AR.js × A-Frame</span>
    <h2>マーカーから、<br>街がひらく。</h2>
    <p>赤い屋根のミニハウス。木々と道路、その向こうの小さな建物。いつもの机が、ひとつの街になります。</p>
    <ol><li><a href="marker.html" target="_blank" rel="noopener">自作マーカーを開く</a>・印刷または別の画面に表示</li><li>ARを開始して、カメラを許可</li><li>マーカー全体を映して、斜め上から観察</li></ol>
    <button id="start" class="primary">カメラでARを開始 ↗</button>
    <a class="preview-link" href="?mode=preview">カメラなしで3Dを見る →</a>
    <p id="startup-message" role="status" class="small">アカウント登録不要。明るい場所でお試しください。</p>
  </main>
  <div id="stage"></div>
  <aside id="controls" class="controls" hidden>
    <div class="status"><span id="indicator"></span><span id="status-text" role="status" aria-live="polite">マーカーを探しています</span></div>
    <div class="buttons"><button id="daynight" aria-pressed="false">夜にする</button><button id="smaller" aria-label="街を縮小">−</button><button id="larger" aria-label="街を拡大">＋</button><a href="marker.html" target="_blank" rel="noopener">マーカー ↗</a><a href="./">終了</a></div>
    <p id="hint">マーカーの黒い枠まで画面に入れてください。</p>
  </aside>
  <noscript>JavaScriptを有効にしてご利用ください。</noscript>
</body>
</html>
